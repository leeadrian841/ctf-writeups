<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writeup | CTF Writeups</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#content">Skip to writeup</a>

  <header class="site-header pt-4 pb-3">
    <div class="container-xxl">
      <a class="brand" href="./"><span class="prompt">~/</span><span data-brand>ctf-writeups</span><span class="cursor" aria-hidden="true"></span></a>
    </div>
  </header>

  <main class="container-xxl">
    <a class="back d-inline-block mt-2 mb-3 text-decoration-none" href="./">← All writeups</a>
    <div id="head"></div>

    <!-- Article on the left, "On this page" on the right from large screens up. -->
    <div class="row pt-4 pb-5">
      <div class="col-lg-9">
        <article class="md" id="content"></article>
        <nav class="w-nav row row-cols-1 row-cols-sm-2 g-3 mt-5" id="w-nav" aria-label="More writeups"></nav>
      </div>
      <aside class="col-lg-3 d-none d-lg-block ps-lg-5" aria-label="On this page">
        <div class="toc" id="toc"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer fixed-bottom py-2">
    <div class="container-xxl text-center" data-footer></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Extra highlight.js languages. Add more from https://cdnjs.com/libraries/highlight.js (languages/<name>.min.js). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/x86asm.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/writeup.js"></script>
</body>
</html>
